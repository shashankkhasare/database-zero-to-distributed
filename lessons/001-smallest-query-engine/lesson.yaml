    title: "The Smallest Query Engine | Database: Zero to Distributed #1"
    description: |-
      How does a database turn a known query into rows?

      In the first lesson of Database: Zero to Distributed, we build a tiny query engine in Rust using Scan, Filter, and Projection. We follow rows through the plan, explain recursive execution, and expose the limitations of materialized execution.

      Read the free book:
      https://shashankkhasare.github.io/database-zero-to-distributed/001-smallest-query-engine.html

      Source code for this lesson:
      https://github.com/shashankkhasare/database-zero-to-distributed/tree/lesson-001

      Project repository:
      https://github.com/shashankkhasare/database-zero-to-distributed

