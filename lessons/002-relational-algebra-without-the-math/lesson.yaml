    title: "Relational Algebra Without the Math | Database: Zero to Distributed #2"
    description: |-
      When do two different query plans mean the same thing?

      In lesson 2 of Database: Zero to Distributed, we use relations, selection, and projection to reason about equivalent logical plans. A counterexample shows why matching on one table is not enough. Three equivalence laws then show when filters may swap, nested projections may collapse, and an early projection may safely remove unused columns.

      Read the free book:
      https://shashankkhasare.github.io/database-zero-to-distributed/002-relational-algebra-without-the-math.html

      Source code for this lesson:
      https://github.com/shashankkhasare/database-zero-to-distributed/tree/lesson-002

      Project repository:
      https://github.com/shashankkhasare/database-zero-to-distributed

