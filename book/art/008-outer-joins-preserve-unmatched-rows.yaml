lesson: "008"
style: book/art/STYLE.md

images:
  - id: join-kinds-preserve-different-rows
    kind: generated-raster
    output: book/images/008-join-kinds-preserve-different-rows.png
    placement: after the chapter epigraph and before the opening prose
    alt: Employee and department rows form three matching pairs, leaving Edsger and Operations unmatched; a preservation key shows which unmatched sides survive each join kind with NULLs for the absent side.
    prompt: >-
      Use case: scientific-educational. Asset type: opening educational
      database diagram. Explain the mechanism of outer joins rather than
      showing four repetitive result tables. Create a literal data diagram,
      not a metaphor and not overlapping circles.

      Use a wide landscape composition with two compact input tables across
      the upper half. The left table is headed exactly "EMPLOYEES" and has
      four rows: "Ada | 10", "Linus | 20", "Grace | 30", and
      "Edsger | NULL". The right table is headed exactly "DEPARTMENTS" and
      has four rows: "10 | Engineering", "20 | Systems",
      "30 | Research", and "40 | Operations". Fill employee rows deep teal
      and department rows ochre. Draw exactly three clean charcoal connector
      lines between the rows with identifiers 10, 20, and 30. Leave Edsger
      and Operations visibly unmatched, with their rows slightly separated
      from the three matched rows.

      Beneath the two inputs, place the exact centered statement
      "ON FINDS 3 MATCHES". Below it, show one compact four-row preservation
      key rather than four panels. Its rows must read exactly:
      "INNER  | matches only"
      "LEFT   | + Edsger | NULL"
      "RIGHT  | + NULL | Operations"
      "FULL   | + both unmatched rows"
      Use muted turquoise behind the common matches idea, deep teal beside
      the preserved-left addition, ochre beside the preserved-right addition,
      and both colors beside FULL. The visual hierarchy must make the causal
      sequence obvious: ON finds pairs first; the join kind then decides which
      unmatched rows survive with NULLs for the absent side.

      Render all text exactly and legibly. Permitted text only:
      "EMPLOYEES", "DEPARTMENTS", "Ada | 10", "Linus | 20",
      "Grace | 30", "Edsger | NULL", "10 | Engineering",
      "20 | Systems", "30 | Research", "40 | Operations",
      "ON FINDS 3 MATCHES", "INNER", "matches only", "LEFT",
      "+ Edsger | NULL", "RIGHT", "+ NULL | Operations", "FULL", and
      "+ both unmatched rows".

      Follow book/art/STYLE.md: warm ivory paper, hand-drawn charcoal ink,
      restrained watercolor and gouache texture, deep teal, muted turquoise,
      ochre, generous margins, strict alignment, and large readable labels. No
      people, buildings, Venn circles, SQL code, extra rows, prose paragraphs,
      arrows, icons, logos, watermark, photorealism, interface chrome, glossy
      3D, gradients, crossed connector lines, or unlisted text.

  - id: on-before-where
    kind: generated-raster
    output: book/images/008-on-before-where.png
    placement: Section 8.11, after the query and before its explanation
    alt: A left join first produces three matched rows and one null-extended Edsger row; a subsequent WHERE filter removes only the Edsger row.
    prompt: >-
      Use case: scientific-educational. Asset type: educational database
      execution-flow diagram. Show that an outer join preserves an unmatched
      row before a later WHERE filter may remove it.

      Use a wide landscape composition with two large horizontal stages
      connected by one clear downward arrow. The upper stage is headed exactly
      "LEFT JOIN ... ON" and contains four aligned result rows in a compact
      two-column table: "Ada | Engineering", "Linus | Systems",
      "Grace | Research", and "Edsger | NULL". Use muted turquoise for the
      three matched rows and deep teal for the null-extended Edsger row.

      Between the stages, place the exact label
      "WHERE d.name IS NOT NULL" beside the downward arrow. The lower stage is
      headed exactly "OUTPUT ROWS" and contains only the three matched rows:
      "Ada | Engineering", "Linus | Systems", and "Grace | Research". Show
      the removed "Edsger | NULL" row once beside the filter boundary as a
      pale faded row, without a cross or deletion icon.

      Follow book/art/STYLE.md: warm ivory paper, hand-drawn charcoal ink,
      restrained watercolor and gouache texture, deep teal, muted turquoise,
      ochre accent only where useful, generous margins, strict alignment, and
      large readable labels. The dataflow must read from top to bottom.
      Permitted text only: "LEFT JOIN ... ON", "WHERE d.name IS NOT NULL",
      "OUTPUT ROWS", "Ada | Engineering", "Linus | Systems",
      "Grace | Research", and "Edsger | NULL". Repetition of the three matched
      rows across the two stages is required. No people, buildings, Venn
      circles, SQL prompt text, extra prose, extra arrows, icons, logos,
      watermark, photorealism, interface chrome, glossy 3D, or gradients.
