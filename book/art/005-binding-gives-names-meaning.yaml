lesson: "005"
style: book/art/STYLE.md

images:
  - id: three-jobs-of-binding
    kind: generated-raster
    output: book/images/005-three-jobs-of-binding.png
    placement: after the chapter epigraph and before the opening prose
    alt: A Query AST with unresolved table, alias, and column names enters a binder supplied by a catalog, becomes a typed bound expression, and is placed in a Project, Filter, and Scan logical plan.
    prompt: >-
      Use case: scientific-educational. Asset type: opening editorial
      illustration for a technical database book chapter about SQL binding.
      Teaching objective: show exactly what the previous chapter produced,
      what remains unresolved, what the binder checks, and what this chapter
      produces. Create one wide left-to-right illustration on warm textured
      paper with the main path QUERY AST to BINDER to BOUND EXPR to LOGICAL
      PLAN. Place CATALOG below BINDER with an upward arrow feeding the binder;
      the catalog is supporting input, not a stage in the horizontal path.

      Region 1, QUERY AST: place the exact heading "QUERY AST" above a query
      card. At the top show the unresolved entries "employees AS e ?" and
      "e.name ?". Below them show the parsed filter tree. Its solid root is
      "AND". The left child is ">"; its left child is "+" with leaves
      "e.salary ?" and "5000", and its right child is "70000". The right
      child of AND is "IS NOT NULL" with leaf "e.name ?". Use solid charcoal
      branches, operators, and numeric literals because parsing has already
      established syntax and precedence. Use dotted ochre boxes only around
      "employees AS e ?", "e.name ?", and "e.salary ?" because those database
      names remain unresolved. Do not make the whole AST dotted.

      Region 2, BINDER: place the exact heading "BINDER" above a broad teal
      inspection frame. Show unresolved name cards entering it. Use straight,
      separate, noncrossing connections with these exact mappings only:
      "employees AS e" connects to "employees"; "e.name" connects to
      "name: TEXT"; and "e.salary" connects to "salary: INTEGER". Never
      connect e.name to salary or e.salary to name. The alias e belongs to the
      binder's query scope after employees AS e resolves to employees; it is
      not stored in the catalog. Also show compatible geometric type shapes
      locking together. Below the binder place a compact drawer labeled
      exactly "CATALOG" containing four large cards: "employees",
      "id: INTEGER", "name: TEXT", and "salary: INTEGER". Connect the catalog
      upward into the binder.

      Region 3, BOUND EXPR: place the exact heading "BOUND EXPR" above the
      same filter-tree shape in solid teal. Replace "e.salary ?" with
      "salary" and "e.name ?" with "name". Add only four small readable type
      badges: "INTEGER" beside the addition node and "BOOLEAN" beside the
      greater-than node, null-test node, and AND root.

      Region 4, LOGICAL PLAN: place the exact heading "LOGICAL PLAN" above
      three stacked rectangular frames connected vertically and labeled
      exactly "PROJECT", "FILTER", and "SCAN" from top to bottom. PROJECT
      contains one checked leaf labeled "name". FILTER contains a small
      simplified copy of the bound Boolean tree. SCAN contains three
      horizontal rows suggesting employee data. Join adjacent plan frames with
      neutral vertical connector lines that have no arrowheads. Alongside the
      three frames, draw one prominent teal arrow whose tail begins beside
      SCAN and whose arrowhead ends beside PROJECT, clearly showing rows
      flowing upward through FILTER toward the plan root. Never draw a
      downward-pointing arrow inside the logical plan. The logical plan is the
      rightmost endpoint with nothing after it.

      Permitted text only: "QUERY AST", "employees AS e", "e.name",
      "e.salary", "AND", ">", "+", "IS NOT NULL", "5000", "70000", "?",
      "BINDER", "CATALOG", "employees", "name: TEXT",
      "id: INTEGER", "salary: INTEGER", "BOUND EXPR", "name", "salary",
      "INTEGER", "BOOLEAN", "LOGICAL PLAN", "PROJECT", "FILTER", and
      "SCAN". Render
      every label exactly. Do not invent, duplicate, misspell, or abbreviate
      text; use "INTEGER" and "BOOLEAN", never "INT" or "BOOL".

      Original editorial illustration with hand-drawn ink contours,
      restrained gouache and watercolor fills, subtle print texture, and the
      warm ivory, charcoal, deep teal, muted turquoise, and ochre palette from
      book/art/STYLE.md. Wide landscape composition, generous margins, large
      readable labels, straight noncrossing connections, and one coherent
      visual flow. No people, logos, watermark, photorealism, interface chrome,
      glossy 3D rendering, factory machinery, digital-looking gradients,
      decorative prose, tiny labels, crossed arrows, or unlisted text.

  - id: column-binding
    kind: generated-raster
    output: book/images/005-column-binding.png
    placement: section 5.4 after column and type binding
    alt: The unresolved AST column e.salary is checked against an employees catalog entry where alias e maps salary to INTEGER, producing a bound salary column with integer type.
    prompt: >-
      Use case: scientific-educational. Asset type: binding transformation
      diagram for a technical database book. Arrange three large cards from
      left to right with clean arrows. The left AST card contains exactly
      "e.salary" and is headed "AST". The center catalog card is headed
      "CATALOG" and contains exactly three large lines: "employees", "e",
      and "salary: INTEGER". Use subtle matching threads to show qualifier e
      and column salary being checked. The right card is headed exactly
      "BOUND" and contains exactly "salary" and "INTEGER". Make it obvious
      that binding removes the qualifier after checking it and carries the
      column type forward. Follow book/art/STYLE.md exactly. Wide landscape
      composition, sparse large text, straight noncrossing paths, generous
      margins. No extra schema fields, code, people, logos, watermark,
      photorealism, glossy 3D rendering, or tiny labels.

  - id: bound-expressions-run-on-rows
    kind: generated-raster
    output: book/images/005-bound-expressions-run-on-rows.png
    placement: section 5.7 after introducing BoundExpr evaluation
    alt: A query AST and catalog create a scope. Binding turns the filter and projection expressions into a bound predicate and bound projection. Filter retains two matching three-value rows, Project turns each into a one-value row, and the output contains those two projected rows.
    prompt: >-
      Use case: scientific-educational. Asset type: compact workflow diagram
      for a technical database book. Create a wide landscape editorial
      illustration showing a precise database binding and execution pipeline.
      Accuracy of every connector is essential.

      At the top, "QUERY AST" and "CATALOG" converge into "SCOPE". SCOPE
      splits into two aligned vertical branches. Keep the FILTER branch
      entirely on the left and the PROJECTION branch entirely on the right.
      The left branch is "FILTER EXPR" through a shared horizontal "BIND"
      gate to "BOUND PREDICATE", which points straight down into "FILTER".
      The right branch is "PROJECTION EXPR" through the same BIND gate to
      "BOUND PROJECTION", which points straight down into "PROJECT". Never
      connect an unbound expression directly to a plan node. Never connect a
      bound predicate to PROJECT or a bound projection to FILTER. Never
      connect the two bound-expression cards to each other.

      Along the bottom, "INPUT ROWS" flow horizontally into FILTER. Inside
      FILTER, show one three-cell row and a checkmark to communicate that the
      BOUND PREDICATE retains matching rows unchanged. Show a "TRUE" badge
      above exactly two stacked matching three-cell rows flowing from FILTER
      into PROJECT. Inside PROJECT, show those two three-cell rows, a
      right-pointing arrow, and two newly constructed one-cell rows to
      communicate evaluation of the BOUND PROJECTION. Those rows flow into
      "OUTPUT ROWS", shown as a small result relation with exactly one column
      and two data rows. Make OUTPUT ROWS the sole endpoint and center it in
      the final row of the composition.

      The only row path is sequential: INPUT ROWS to FILTER, matching row to
      PROJECT, then constructed row to OUTPUT ROWS. There is no bypass and no
      merge. Checked expressions enter their corresponding plan nodes from
      above; rows move from left to right.

      Permitted text only: "QUERY AST", "CATALOG", "SCOPE", "FILTER EXPR",
      "PROJECTION EXPR", "BIND", "BOUND PREDICATE", "BOUND PROJECTION",
      "FILTER", "PROJECT", "INPUT ROWS", "TRUE", and "OUTPUT ROWS". Render
      every label exactly once. Do not invent, duplicate, misspell, or
      abbreviate text.

      Follow book/art/STYLE.md: original editorial illustration with
      hand-drawn ink contours, restrained gouache and watercolor fills,
      subtle print texture, warm ivory background, charcoal outlines, deep
      teal and muted turquoise for checked structures, and ochre for unresolved
      inputs. Wide landscape composition, generous margins, large readable
      labels, straight noncrossing arrows, and clear visual hierarchy. No
      people, code listings, logos, watermark, photorealism, interface chrome,
      glossy 3D rendering, decorative prose, tiny labels, crossed arrows, or
      unlisted text.
